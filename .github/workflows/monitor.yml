name: Monitor Senegal La Poste

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

      - name: Run Senegal La Poste monitor
        run: |
          python monitor.py

      - name: Upload diagnostic artifacts if the monitor fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: senegalpost-diagnostics
          path: |
            diagnostics/
          if-no-files-found: ignore

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results.txt

          if git diff --cached --quiet; then
            echo "No changes to results.txt"
          else
            git commit -m "Update Senegal La Poste letter rates"
            git push
          fi
