name: Monitor Senegal La Poste

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run Senegal La Poste monitor
        run: |
          python monitor.py

      - name: Commit updated results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results.txt

          if git diff --cached --quiet; then
            echo "No changes to results.txt"
          else
            git commit -m "Update Senegal La Poste letter rates"
            git push
          fi
